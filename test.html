<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Test Page</title>
    <style>
      *,
      *::backdrop,
      ::after {
        margin: o;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        line-height: 1.5;
        padding: 24px;
        max-width: 1400px;
        margin: 0 auto;
        scroll-behavior: smooth;
      }
      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: blueviolet;
        padding: 1rem 2rem;
        border-radius: 15px;
        margin-bottom: 2rem;
      }
   
      .mood {
        margin: auto;
        cursor: pointer;
      }
     
    </style>
  </head>
  <body>
    <div class="header-top">
      <div class="aa">
        <img src="assets/images/logo.svg" alt="" class="icon" />
      </div>
      <div>
        <img
          src="assets/images/icon-sun.svg"
          alt=""
          class="mood"
          type="button"
        />
        <img src="assets/images/icon-moon.svg" alt="">
      </div>
    </div>
   <div for="" class="care">
    <div class="a"> </div>
<div class="dot"></div>
   </div>
  </body>
</html>
